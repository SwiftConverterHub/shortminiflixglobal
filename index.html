<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortMiniFlix Global</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        header { text-align: center; color: #e50914; font-size: 28px; font-weight: 800; margin-bottom: 20px; }
        .section-title { color: #fff; margin-top: 30px; border-left: 4px solid #e50914; padding-left: 10px; }
        .scroll { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; }
        .card { min-width: 140px; cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; border-radius: 10px; }
        .card p { font-size: 14px; text-align: center; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #player-area { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 9999; }
        .close-btn { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

<header>SHORTMINIFLIX GLOBAL</header>
<div id="content"></div>

<div id="player-area">
    <span class="close-btn" onclick="document.getElementById('player-area').style.display='none'">&times;</span>
    <iframe id="video-frame" width="100%" height="90%" style="margin-top:5%" frameborder="0" allowfullscreen></iframe>
</div>

<script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6wWAZd3zUj5UqzxkX2ln7hOq1DwjTNCaNOfudPbuUPHzzd4GQZVM_V9tX8Li6nG_gC88eFm42tJmg/pub?output=csv";

    async function loadData() {
        const response = await fetch(csvUrl);
        const data = await response.text();
        const rows = data.split('\n').slice(1);
        
        let categories = {};

        rows.forEach(row => {
            const [name, link, poster, category] = row.split(',');
            if(!name || !category) return;
            
            const cat = category.trim();
            if(!categories[cat]) categories[cat] = [];
            categories[cat].push({name, link, poster});
        });

        const content = document.getElementById('content');
        for(const cat in categories) {
            content.innerHTML += `<h3 class="section-title">${cat}</h3><div class="scroll" id="${cat}-list"></div>`;
            categories[cat].forEach(film => {
                document.getElementById(cat + '-list').innerHTML += `
                    <div class="card" onclick="play('${film.link}')">
                        <img src="${film.poster}" loading="lazy">
                        <p>${film.name}</p>
                    </div>`;
            });
        }
    }

    function play(link) {
        document.getElementById('video-frame').src = link;
        document.getElementById('player-area').style.display = 'block';
    }

    loadData();
</script>
</body>
</html>
