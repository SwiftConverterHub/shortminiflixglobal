<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortMiniFlixGlobal - Türkçe Dublaj Mini Dramalar</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #1a1a1a;
            background: #111;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #e50914;
            letter-spacing: 1px;
        }
        .categories {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            background-color: #141414;
            overflow-x: auto;
            white-space: nowrap;
        }
        .category-btn {
            background: #222;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .category-btn:hover {
            background: #e50914;
            border-color: #e50914;
        }
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section-title {
            font-size: 20px;
            margin: 20px 0 15px 0;
            border-left: 4px solid #e50914;
            padding-left: 10px;
            font-weight: bold;
        }
        .drama-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }
        .drama-card {
            background: #181818;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            border: 1px solid #222;
        }
        .drama-card:hover {
            transform: scale(1.04);
            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.3);
        }
        .drama-thumb {
            width: 100%;
            height: 230px;
            object-fit: cover;
            background: #222;
        }
        .episode-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.85);
            color: #4df3a9; 
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            font-weight: bold;
        }
        .drama-info {
            padding: 10px;
        }
        .drama-name {
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">SHORTMINIFLIX GLOBAL</div>
</header>

<div class="categories">
    <button class="category-btn">Yeniden Doğuş</button>
    <button class="category-btn">Özel Güç</button>
    <button class="category-btn">Aile</button>
    <button class="category-btn">Aşk & Romantizm</button>
</div>

<div class="container">
    
    <div class="section-title">Yeni Eklenenler</div>
    <div class="drama-grid">
        
        <!-- ÖRNEK FİLM 1 -->
        <div class="drama-card" onclick="diziyeGit('olum-kitabi', 'https://reklam-linkimiz.com')">
            <div class="episode-badge">64 Bölüm Tek Parça</div>
            <img class="drama-thumb" src="https://via.placeholder.com/160x230" alt="Dizi Afişi">
            <div class="drama-info">
                <div class="drama-name">Ölüm Kitabı ile Dünyaya Dönüş</div>
            </div>
        </div>

        <!-- ÖRNEK FİLM 2 -->
        <div class="drama-card" onclick="diziyeGit('yeniden-dogus', 'https://reklam-linkimiz.com')">
            <div class="episode-badge">80 Bölüm Tek Parça</div>
            <img class="drama-thumb" src="https://via.placeholder.com/160x230" alt="Dizi Afişi">
            <div class="drama-info">
                <div class="drama-name">Yeniden Doğuş: Efsanevi Şifacı</div>
            </div>
        </div>

    </div>
</div>

<script>
    function diziyeGit(diziSayfasiAdi, reklamLinki) {
        window.open(reklamLinki, '_blank');
        window.location.href = diziSayfasiAdi + '.html';
    }
</script>

</body>
</html>
